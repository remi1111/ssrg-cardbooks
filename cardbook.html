<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperStar Cardbook Manager (Static JSON Edition)</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            user-select: none;
        }

        body {
            background-color: #0b0f19;
            background-image:
                radial-gradient(circle at 15% 20%, rgba(236, 72, 153, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(59, 130, 246, 0.12) 0%, transparent 40%);
            color: #f8fafc;
            min-height: 100vh;
            padding: 30px 20px;
        }

        .main-wrapper {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Top Navigation Bar */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .brand-title h1 {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #ec4899, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .brand-title p {
            color: #94a3b8;
            font-size: 13px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.06);
            color: #cbd5e1;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(12px);
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateX(3px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        /* Control Panel Wrapper */
        .control-panel-wrapper {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .control-row {
            display: flex;
            gap: 20px;
            align-items: flex-end;
            flex-wrap: wrap;
        }

        .output-container {
            flex: 1;
            min-width: 280px;
        }

        .output-container label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #cbd5e1;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 8px;
        }

        .output-container input {
            width: 100%;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 14px 16px;
            color: #ec4899;
            font-family: monospace;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1px;
            outline: none;
            transition: all 0.3s ease;
        }

        .output-container input:focus {
            border-color: #ec4899;
            box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.2);
        }

        .action-buttons-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .action-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 22px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .activate-btn {
            background: linear-gradient(135deg, #ec4899 0%, #be185d 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(236, 72, 153, 0.3);
        }

        .activate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(236, 72, 153, 0.5);
        }

        .import-btn {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }

        .import-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.5);
        }

        /* Cardbook Structure Styling */
        .artist-section {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 30px;
        }

        .artist-title {
            font-size: 22px;
            font-weight: 800;
            color: #f1f5f9;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .theme-section {
            margin-bottom: 24px;
        }

        .theme-section:last-child {
            margin-bottom: 0;
        }

        .theme-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }

        .theme-title {
            font-size: 15px;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Theme Type Badges */
        .theme-badge {
            font-size: 10px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-block;
        }

        .theme-badge.limited {
            background: rgba(234, 179, 8, 0.15);
            color: #facc15;
            border: 1px solid rgba(234, 179, 8, 0.3);
            box-shadow: 0 0 10px rgba(234, 179, 8, 0.15);
        }

        .theme-badge.event {
            background: rgba(236, 72, 153, 0.15);
            color: #f472b6;
            border: 1px solid rgba(236, 72, 153, 0.3);
            box-shadow: 0 0 10px rgba(236, 72, 153, 0.15);
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 14px;
        }

        /* Card Elements & Grades */
        .ss-card {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 12px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 140px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .ss-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        .grade-badge {
            font-size: 18px;
            font-weight: 800;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 4px;
        }

        .card-name {
            font-size: 12px;
            font-weight: 700;
            color: #e2e8f0;
            text-align: center;
            margin: 6px 0;
            word-break: break-word;
        }

        .stars {
            font-size: 11px;
            letter-spacing: -1px;
            min-height: 14px;
        }

        /* Dynamic Card Grade Styles */
        .ss-card.grade-x {
            background: rgba(30, 41, 59, 0.4);
            border-color: rgba(255, 255, 255, 0.05);
            opacity: 0.5;
        }
        .ss-card.grade-x .grade-badge { color: #64748b; background: rgba(255, 255, 255, 0.05); }

        .ss-card.grade-c {
            background: rgba(148, 163, 184, 0.12);
            border-color: rgba(148, 163, 184, 0.3);
        }
        .ss-card.grade-c .grade-badge { color: #cbd5e1; background: rgba(148, 163, 184, 0.2); }
        .ss-card.grade-c .stars { color: #cbd5e1; }

        .ss-card.grade-b {
            background: rgba(59, 130, 246, 0.12);
            border-color: rgba(59, 130, 246, 0.35);
        }
        .ss-card.grade-b .grade-badge { color: #60a5fa; background: rgba(59, 130, 246, 0.2); }
        .ss-card.grade-b .stars { color: #60a5fa; }

        .ss-card.grade-a {
            background: rgba(234, 179, 8, 0.12);
            border-color: rgba(234, 179, 8, 0.35);
        }
        .ss-card.grade-a .grade-badge { color: #facc15; background: rgba(234, 179, 8, 0.2); }
        .ss-card.grade-a .stars { color: #facc15; }

        .ss-card.grade-s {
            background: rgba(168, 85, 247, 0.15);
            border-color: rgba(168, 85, 247, 0.4);
        }
        .ss-card.grade-s .grade-badge { color: #c084fc; background: rgba(168, 85, 247, 0.25); }
        .ss-card.grade-s .stars { color: #c084fc; }

        .ss-card.grade-r {
            background: linear-gradient(135deg, rgba(236, 72, 153, 0.2) 0%, rgba(239, 68, 68, 0.2) 100%);
            border-color: rgba(236, 72, 153, 0.5);
            box-shadow: 0 0 15px rgba(236, 72, 153, 0.15);
        }
        .ss-card.grade-r .grade-badge { color: #f472b6; background: rgba(236, 72, 153, 0.3); font-size: 20px; }
        .ss-card.grade-r .stars { color: #f472b6; font-weight: 800; }
    </style>
</head>
<body>

    <div class="main-wrapper">

        <!-- Top Navigation -->
        <div class="top-nav">
            <div class="brand-title">
                <h1>SuperStar Cardbook Manager</h1>
                <p>JSON Data-Driven Static Architecture</p>
            </div>
            <a href="index.html" class="back-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5"></path>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                <span>Back to Games</span>
            </a>
        </div>

        <!-- Control Panel Dashboard -->
        <div class="control-panel-wrapper">
            <div class="control-row">
                <div class="output-container">
                    <label>Card Book Inventory Token String</label>
                    <input type="text" id="cardStringBox" placeholder="CLICK EXPORT OR PASTE CODE HERE...">
                </div>
                <div class="action-buttons-group">
                    <button class="action-btn activate-btn" onclick="exportCardString()">
                        <span>⚡</span> Export
                    </button>
                    <button class="action-btn import-btn" onclick="importCardString()">
                        <span>📥</span> Import
                    </button>
                </div>
            </div>
        </div>

        <!-- Dynamic Container where cards load from JSON -->
        <div id="cardbook-container"></div>

    </div>

    <script>
        // --- 1. Your JSON Data Object ---
        const cardsData = {
            "artists": [
                {
                    "id": "twice",
                    "name": "TWICE",
                    "themes": [
                        {
                            "id": "fancy",
                            "name": "FANCY",
                            "themeType": "normal",
                            "cards": [
                                { "globalId": 0, "name": "Nayeon" },
                                { "globalId": 1, "name": "Jeongyeon" },
                                { "globalId": 2, "name": "Momo" }
                            ]
                        },
                        {
                            "id": "formula_of_love",
                            "name": "Formula of Love",
                            "themeType": "limited",
                            "cards": [
                                { "globalId": 3, "name": "Nayeon" },
                                { "globalId": 4, "name": "Jeongyeon" },
                                { "globalId": 5, "name": "Momo" },
                                { "globalId": 6, "name": "Sana" }
                            ]
                        },
                        {
                            "id": "halloween_party",
                            "name": "Monster House",
                            "themeType": "event",
                            "cards": [
                                { "globalId": 7, "name": "Jihyo" },
                                { "globalId": 8, "name": "Mina" },
                                { "globalId": 9, "name": "Dahyun" }
                            ]
                        }
                    ]
                },
                {
                    "id": "itzy",
                    "name": "ITZY",
                    "themes": [
                        {
                            "id": "checkmate",
                            "name": "CHECKMATE",
                            "themeType": "limited",
                            "cards": [
                                { "globalId": 10, "name": "Yeji" },
                                { "globalId": 11, "name": "Lia" },
                                { "globalId": 12, "name": "Ryujin" }
                            ]
                        }
                    ]
                }
            ]
        };

        // Grade Configurations
        const gradeConfig = {
            'x': { badge: '-', stars: '' },
            'c': { badge: 'C', stars: '★' },
            'b': { badge: 'B', stars: '★★' },
            'a': { badge: 'A', stars: '★★★' },
            's': { badge: 'S', stars: '★★★★' },
            'r': { badge: 'R', stars: 'R' }
        };

        const gradeCycle = ['x', 'c', 'b', 'a', 's', 'r'];
        let totalGlobalCardsCount = 0;

        // --- 2. Render Cards on Load ---
        document.addEventListener("DOMContentLoaded", () => {
            totalGlobalCardsCount = cardsData.artists.reduce((acc, artist) => {
                return acc + artist.themes.reduce((tAcc, theme) => tAcc + theme.cards.length, 0);
            }, 0);

            renderCardbook(cardsData.artists);
            loadSavedInventory();
        });

        function renderCardbook(artists) {
            const container = document.getElementById('cardbook-container');
            container.innerHTML = '';

            artists.forEach(artist => {
                let artistHTML = `
                    <div class="artist-section">
                        <div class="artist-title">${artist.name}</div>
                `;

                artist.themes.forEach(theme => {
                    // Generate Badge HTML according to themeType
                    let badgeHTML = '';
                    const type = (theme.themeType || 'normal').toLowerCase();

                    if (type === 'limited') {
                        badgeHTML = `<span class="theme-badge limited">Limited Theme</span>`;
                    } else if (type === 'event' || type === 'event limited' || type === 'event_limited') {
                        badgeHTML = `<span class="theme-badge event">Event Limited</span>`;
                    }

                    artistHTML += `
                        <div class="theme-section">
                            <div class="theme-header">
                                <span class="theme-title">${theme.name}</span>
                                ${badgeHTML}
                            </div>
                            <div class="cards-grid">
                    `;

                    theme.cards.forEach(card => {
                        artistHTML += `
                            <div class="ss-card grade-x"
                                 data-global-index="${card.globalId}"
                                 data-grade="x"
                                 onclick="toggleCardGrade(this)">
                                <span class="grade-badge">-</span>
                                <span class="card-name">${card.name}</span>
                                <span class="stars"></span>
                            </div>
                        `;
                    });

                    artistHTML += `</div></div>`;
                });

                artistHTML += `</div>`;
                container.innerHTML += artistHTML;
            });
        }

        // --- 3. Interactive Card Click (Cycles Grades) ---
        function toggleCardGrade(cardElement) {
            const currentGrade = cardElement.getAttribute('data-grade') || 'x';
            const currentIndex = gradeCycle.indexOf(currentGrade);
            const nextGrade = gradeCycle[(currentIndex + 1) % gradeCycle.length];

            cardElement.classList.remove(`grade-${currentGrade}`);
            cardElement.classList.add(`grade-${nextGrade}`);
            cardElement.setAttribute('data-grade', nextGrade);

            cardElement.querySelector('.grade-badge').innerText = gradeConfig[nextGrade].badge;
            cardElement.querySelector('.stars').innerText = gradeConfig[nextGrade].stars;
        }

        // --- 4. Export Function ---
        function exportCardString() {
            let masterChars = new Array(totalGlobalCardsCount).fill('X');
            const allCards = document.querySelectorAll('.ss-card');

            allCards.forEach(card => {
                const globalIndex = parseInt(card.getAttribute('data-global-index'), 10);
                const grade = (card.getAttribute('data-grade') || 'x').toUpperCase();

                if (!isNaN(globalIndex) && globalIndex < masterChars.length) {
                    masterChars[globalIndex] = grade;
                }
            });

            const masterString = masterChars.join('');
            document.getElementById('cardStringBox').value = masterString;

            localStorage.setItem('ss_card_inventory', masterString);
            alert("Inventory string generated & saved to browser!");
        }

        // --- 5. Import Function ---
        function importCardString() {
            const displayBox = document.getElementById('cardStringBox');
            if (!displayBox) return;

            let inputString = displayBox.value.trim().toUpperCase();
            const allCards = document.querySelectorAll('.ss-card');

            if (inputString.length === 0) {
                alert("Please paste a valid card string first!");
                return;
            }

            if (inputString.length > totalGlobalCardsCount) {
                inputString = inputString.substring(0, totalGlobalCardsCount);
            }
            if (inputString.length < totalGlobalCardsCount) {
                inputString += "X".repeat(totalGlobalCardsCount - inputString.length);
            }

            allCards.forEach(card => {
                const globalIndex = parseInt(card.getAttribute('data-global-index'), 10);
                const charToken = inputString[globalIndex] || 'X';

                let targetGrade = 'x';
                if (charToken === 'C') targetGrade = 'c';
                else if (charToken === 'B') targetGrade = 'b';
                else if (charToken === 'A') targetGrade = 'a';
                else if (charToken === 'S') targetGrade = 's';
                else if (charToken === 'R') targetGrade = 'r';

                let oldGrade = card.getAttribute('data-grade') || 'x';

                card.classList.remove(`grade-${oldGrade}`);
                card.classList.add(`grade-${targetGrade}`);
                card.setAttribute('data-grade', targetGrade);

                card.querySelector('.grade-badge').innerText = gradeConfig[targetGrade].badge;
                card.querySelector('.stars').innerText = gradeConfig[targetGrade].stars;
            });

            localStorage.setItem('ss_card_inventory', inputString);
        }

        // --- 6. Load Progress from LocalStorage ---
        function loadSavedInventory() {
            const savedString = localStorage.getItem('ss_card_inventory');
            if (savedString) {
                document.getElementById('cardStringBox').value = savedString;
                importCardString();
            }
        }
    </script>
</body>
</html>
