<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperStar Cardbook Manager (Static JSON Edition)</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styling/cardbook.css">
</head>

<body>

    <div class="main-wrapper">

        <!-- Top Navigation -->
        <div class="top-nav">
            <div class="brand-title">
                <h1>SuperStar Cardbook Manager</h1>
                <p>JSON Data-Driven Static Architecture</p>
            </div>
            <a href="index.html" class="back-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5"></path>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                <span>Back to Games</span>
            </a>
        </div>

        <!-- Control Panel Dashboard -->
        <div class="control-panel-wrapper">
            <div class="control-row">
                <div class="output-container">
                    <label>Card Book Inventory Token String</label>
                    <input type="text" id="cardStringBox" placeholder="CLICK EXPORT OR PASTE CODE HERE...">
                </div>
                <div class="action-buttons-group">
                    <button class="action-btn activate-btn" onclick="exportCardString()">
                        <span>⚡</span> Export
                    </button>
                    <button class="action-btn import-btn" onclick="importCardString()">
                        <span>📥</span> Import
                    </button>
                </div>
            </div>
        </div>

        <!-- Dynamic Container where cards load from JSON -->
        <div id="cardbook-container"></div>

    </div>
    <script>
        // Fetch data.
        let cardsData = null;
        let totalGlobalCardsCount = 0;

        document.addEventListener("DOMContentLoaded", async () => {
            try {
                const response = await fetch('./cards.json');
                cardsData = await response.json();

                // Calculate total global cards based on the highest globalId found,
                // ensuring indices never shift when cards are removed.
                let maxId = -1;
                cardsData.games.forEach(game => {
                    game.artists.forEach(artist => {
                        artist.themes.forEach(theme => {
                            theme.cards.forEach(card => {
                                if (card.globalId > maxId) maxId = card.globalId;
                            });
                        });
                    });
                });
                totalGlobalCardsCount = maxId + 1;

                renderCardbook(cardsData.games, "jyp");
                loadSavedInventory();

            } catch (error) {
                console.error("Failed to load cards.json:", error);
            }
        });

    </script>
    <script src="cardbook.js"></script>
</body>

</html>
